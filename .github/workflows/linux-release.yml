name: Linux release assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest -q
      - name: Build release payloads
        run: uv run python scripts/build_release_assets.py --output dist/release
      - name: Verify release payloads
        run: uv run python scripts/verify_release_assets.py dist/release
      - name: Extract required version changelog
        run: uv run python scripts/release_notes.py --output dist/RELEASE_NOTES.md
      - name: Verify tag/version contract
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python scripts/verify_release_assets.py dist/release --tag "${GITHUB_REF_NAME}"
      - name: Offline fresh-home acceptance
        run: uv run python scripts/offline_linux_acceptance.py --assets dist/release --root .acceptance
      - name: Upload verified CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-peek-linux-release-assets
          path: dist/release/*
          if-no-files-found: error

  publish-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact verified asset set
        uses: actions/download-artifact@v4
        with:
          name: hermes-peek-linux-release-assets
          path: dist/release
      - uses: actions/checkout@v4
      - name: Extract required version changelog
        run: python scripts/release_notes.py --tag "${GITHUB_REF_NAME}" --output dist/RELEASE_NOTES.md
      - name: Publish assets for an explicitly pushed version tag only
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          fail_on_unmatched_files: true
          body_path: dist/RELEASE_NOTES.md
