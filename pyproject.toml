[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-peek"
version = "0.1.0"
description = "Preview files created by Hermes directly inside Telegram."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "markdown-it-py>=3,<4",
  "pyyaml>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.scripts]
hermes-peek = "hermes_peek.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
