[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-peek"
version = "0.2.14"
description = "Preview files created by Hermes directly inside Telegram."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["hermes-agent", "telegram", "mini-app", "file-preview"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Utilities",
]
dependencies = [
  "bleach>=6,<7",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "markdown-it-py>=3,<4",
  "pyyaml>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.scripts]
hermes-peek = "hermes_peek.cli:main"

[project.urls]
Homepage = "https://github.com/KumaCool/HermesPeek"
Repository = "https://github.com/KumaCool/HermesPeek.git"
Issues = "https://github.com/KumaCool/HermesPeek/issues"
Changelog = "https://github.com/KumaCool/HermesPeek/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_peek"]

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "integrations", "deploy", "docs", "README.md", "README.zh-CN.md", "CHANGELOG.md", "LICENSE"]
